name: Publicar Cloud47

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Descomprimir la web
        run: |
          unzip -q Cloud47-tiiny-host.zip -d _site
          test -f _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar la web
        id: deployment
        uses: actions/deploy-pages@v4
